name: Release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libsdl2-ttf-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libglu1-mesa-dev libwayland-dev libxkbcommon-dev \
            libsnappy-dev libzstd-dev libavcodec-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUNITTEST=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Package
        run: |
          mkdir -p dist
          cp build/PPSSPPSDL dist/
          cp -r build/assets dist/
          tar czf ppsspp-tales-mp-linux-x64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ppsspp-tales-mp-linux-x64.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Configure
        shell: cmd
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DUNITTEST=OFF
      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Windows\Release\PPSSPPWindows64.exe dist\
          if (Test-Path build\assets) { Copy-Item -Recurse build\assets dist\ }
          Compress-Archive -Path dist\* -DestinationPath ppsspp-tales-mp-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ppsspp-tales-mp-windows-x64.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-x64/ppsspp-tales-mp-linux-x64.tar.gz
            artifacts/windows-x64/ppsspp-tales-mp-windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
